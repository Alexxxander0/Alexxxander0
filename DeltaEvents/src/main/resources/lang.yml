  already_running: "{sumo_prefix}&#FF4C4C&lГрешка &8• &#E6E6E6Вече има активен или стартиращ Сумо евент!"
  not_running: "{sumo_prefix}&#FF4C4C&lГрешка &8• &#E6E6E6В момента няма активен Сумо евент."
