  round_subtitle: "&#E6E6E6Пригответе се!"
  invalid_round: "{sumo_prefix}&#FF4C4C&lГрешка &8• &#E6E6E6Моля въведете валидно число за рунд."
  rules_sent: "{sumo_prefix}&#4CFF7A&lУспех &8• &#E6E6E6Правилата бяха изпратени в &f{world}"
  rules_sent_console: "&aПравилата бяха изпратени в {world}"
