  usage_round: " &8• &f/sumo round <номер> &7- Стартира определен рунд"
  usage_giveitems: " &8• &f/sumo giveitems &7- Дава Сумо пръчката"
  usage_stop: " &8• &f/sumo stop &7- Спира евента"
  usage_reload: " &8• &f/sumo reload &7- Релоудва само Сумо евента"
  usage_editor: " &8• &f/sumo editor <spawn|participant|floor> &7- Дава предмет за редактиране"
