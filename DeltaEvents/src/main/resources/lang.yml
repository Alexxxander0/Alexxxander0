# =====================================================================
# Sumo Event Messages
# =====================================================================
sumo:
  prefix: "&#4AA3FF&lСумо &8• &7"
  rules:
    - "&#4AA3FF&lПравила на евента:"
    - "&8• &#E6E6E6Забранена е отборната игра, всеки играе сам за себе си!"
    - "&8• &#E6E6E6Забранено е използването на всякакви нелегални клиенти!"
    - "&8• &#E6E6E6Който бъде избутан извън ограждението на арената (spruce slab) е елиминиран от евента"
    - "&8• &#E6E6E6Победителят е последният оцелял на арената!"
  only_in_world: "{sumo_prefix}&#FF4C4C&lГрешка &8• &#E6E6E6Тази команда може да се използва само в уърълда {world}!"
