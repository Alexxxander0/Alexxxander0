  usage_footer: "&8&m----------------------------------------"
  getitems_success: "{sumo_prefix}&#4CFF7A&lУспех &8• &#E6E6E6Получихте Сумо пръчката!"
  only_players: "&#FF4C4C&lГрешка &8• &#E6E6E6Тази команда може да се използва само от играчи!"

